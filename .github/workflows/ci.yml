name: CI

on:
  push:
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo test --locked --all-features --all-targets
      - run: cargo doc --no-deps --all-features

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo test --locked --no-default-features --all-targets
      - run: cargo check --locked --all-features --all-targets
      - run: cargo bench --locked --no-run --all-features
      - run: cargo run --locked --no-default-features --bin textintel -- eval data/evaluation --split test --gates data/quality-gates.json
      - run: cargo run --locked --all-features --bin textintel -- eval data/evaluation/ --split test --production --gates data/quality-gates-production.json

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
      - run: cargo test --locked --all-targets --no-default-features

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - run: cd fuzz && cargo fuzz run unicode corpus/unicode -- -max_total_time=60
      - run: cd fuzz && cargo fuzz run tokenization corpus/tokenization -- -max_total_time=60
      - run: cd fuzz && cargo fuzz run rebus corpus/rebus -- -max_total_time=240
