[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textintel"
version = "0.1.0"
description = "Multilingual text intelligence: independent analysis channels, compare, and rebus decode"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
semantic = []
phonetic = []
ml = []
all = []
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["textintel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
