[package]
name = "textintel"
version = "0.2.0"
edition = "2024"
build = "build.rs"
description = "Multilingual text intelligence with independent, explainable analysis channels"
license = "MIT"
readme = "README.md"
repository = "https://github.com/nglmercer/textintel"
rust-version = "1.90"

[lib]
name = "textintel"
path = "src/lib.rs"

[[bin]]
name = "textintel"
path = "src/bin/textintel/main.rs"

[[example]]
name = "espeak"
required-features = ["phonetic-espeak"]

[features]
default = ["lang-profile", "semantic-local", "phonetic-ipa"]
lang-profile = []
semantic = ["semantic-local"]
semantic-local = []
phonetic-espeak = []
ann-hnsw = ["dep:hnsw_rs"]
persist-redb = ["dep:redb"]
phonetic = ["phonetic-ipa"]
phonetic-ipa = []
persist = []
production-local-lite = ["lang-profile", "semantic-local", "phonetic-ipa"]
production-local = ["production-local-lite", "phonetic-espeak", "ann-hnsw", "persist", "persist-redb"]
all = ["production-local"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "=0.4.43", default-features = false, features = ["std"] }
thiserror = "2"
sha2 = "0.11"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
unicode-properties = { version = "0.1.4", features = ["emoji", "general-category"] }
unicode-script = "0.5"
hnsw_rs = { version = "0.3", optional = true }
redb = { version = "4", optional = true }

[dev-dependencies]
criterion = "0.8"
pretty_assertions = "1"
proptest = "1"

[[bench]]
name = "core"
harness = false

[[bench]]
name = "ann"
harness = false

[profile.release]
lto = true
codegen-units = 1
