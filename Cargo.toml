[package]
name = "textintel"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Multilingual text intelligence with independent, explainable analysis channels"
license = "MIT"
readme = "README.md"
rust-version = "1.70"

[lib]
name = "textintel"
path = "src/lib.rs"

[[bin]]
name = "textintel"
path = "src/bin/textintel.rs"

[features]
default = []
semantic = []
phonetic = []
ml = []
all = ["semantic", "phonetic", "ml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
