[package]
name = "textintel"
version = "0.2.0"
edition = "2024"
build = "build.rs"
description = "Multilingual text intelligence with independent, explainable analysis channels"
license = "MIT"
readme = "README.md"
repository = "https://github.com/nglmercer/textintel"
rust-version = "1.90"

[lib]
name = "textintel"
path = "src/lib.rs"

[[bin]]
name = "textintel"
path = "src/bin/textintel/main.rs"

[[bin]]
name = "textintel-train"
path = "tools/train_similarity/main.rs"

[[bin]]
name = "textintel-train-decision"
path = "tools/train_decision_v2/main.rs"
required-features = ["decision-transformer"]

[[bin]]
name = "textintel-eval-llm"
path = "tools/eval_llm/main.rs"
required-features = ["decision-http"]

[[example]]
name = "espeak"
required-features = ["phonetic-espeak"]

[[example]]
name = "transformer_embeddings"
required-features = ["semantic-transformer"]

[features]
default = ["lang-profile", "semantic-local", "semantic-transformer", "phonetic-ipa", "phonetic-espeak", "ann-hnsw", "persist", "persist-redb"]
lang-profile = []
semantic = ["semantic-local"]
semantic-local = []
semantic-transformer = ["dep:candle-core"]
phonetic-espeak = []
ann-hnsw = ["dep:hnsw_rs"]
persist-redb = ["dep:redb"]
semantic-http = ["dep:ureq"]
phonetic = ["phonetic-ipa"]
phonetic-ipa = []
persist = []
# Typed local decisions (TextIntel S1). The base API (types, providers,
# adapters, scoring, calibration, artifacts, fusion, datasets, eval) is
# dependency-free and always compiled; these features gate the backends.
decision = []
decision-transformer = ["decision", "semantic-transformer"]
decision-http = ["decision", "dep:ureq"]
decision-modernbert = ["decision-transformer"]
ml = ["lang-profile", "semantic-local", "phonetic-ipa"]
production-local-lite = ["lang-profile", "semantic-local", "phonetic-ipa"]
production-local = ["lang-profile", "semantic-local", "semantic-transformer", "phonetic-ipa", "phonetic-espeak", "ann-hnsw", "persist", "persist-redb"]
all = ["lang-profile", "semantic-local", "semantic-transformer", "semantic-http", "phonetic-ipa", "phonetic-espeak", "ann-hnsw", "persist", "persist-redb", "ml", "production-local-lite", "production-local", "decision", "decision-transformer", "decision-http", "decision-modernbert"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
unicode-properties = { version = "0.1.4", features = ["emoji", "general-category"] }
unicode-script = "0.5"
ureq = { version = "3", optional = true, default-features = false, features = ["json", "rustls", "rustls-webpki-roots"] }
candle-core = { version = "0.11", optional = true, default-features = false }
hnsw_rs = { version = "0.3", optional = true }
redb = { version = "4", optional = true }

[dev-dependencies]
criterion = "0.8"
pretty_assertions = "1"
proptest = "1"

[[bench]]
name = "core"
harness = false

[[bench]]
name = "ann"
harness = false

[profile.release]
lto = true
codegen-units = 1
