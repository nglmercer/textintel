[package]
name = "textintel"
version = "0.2.0"
edition = "2021"
build = "build.rs"
description = "Multilingual text intelligence with independent, explainable analysis channels"
license = "MIT"
readme = "README.md"
rust-version = "1.71"

[lib]
name = "textintel"
path = "src/lib.rs"

[[bin]]
name = "textintel"
path = "src/bin/textintel.rs"

[[bin]]
name = "textintel-train"
path = "tools/train_similarity.rs"

[features]
default = []
lang-profile = []
semantic = ["semantic-local"]
semantic-local = []
semantic-candle = ["dep:candle-core"]
phonetic-espeak = []
ann-hnsw = ["dep:hnsw_rs"]
persist-redb = ["dep:redb"]
semantic-http = ["dep:ureq"]
phonetic = ["phonetic-ipa"]
phonetic-ipa = []
persist = []
ml = ["lang-profile", "semantic-local", "phonetic-ipa"]
production-local = []
all = ["lang-profile", "semantic-local", "semantic-candle", "semantic-http", "phonetic-ipa", "phonetic-espeak", "ann-hnsw", "persist", "persist-redb", "ml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
unicode-properties = { version = "0.1.4", features = ["emoji", "general-category"] }
unicode-script = "0.5"
ureq = { version = "2.12.1", optional = true, default-features = false, features = ["json", "tls"] }
candle-core = { version = "0.11", optional = true, default-features = false }
hnsw_rs = { version = "0.3", optional = true }
redb = { version = "4", optional = true }

[dev-dependencies]
criterion = "=0.5.1"
pretty_assertions = "1"
proptest = "=1.6.0"

[[bench]]
name = "core"
harness = false

[[bench]]
name = "ann"
harness = false

[profile.release]
lto = true
codegen-units = 1
